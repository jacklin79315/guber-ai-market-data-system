name: P3 24-Month Walk-Forward Research Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p3b-paper-engine
    paths:
      - p3/walk_forward_feedback.py
      - p3/walk_forward_training_entry.py
      - tests/test_walk_forward_feedback.py
      - .github/workflows/p3-ai-100-experiments.yml

concurrency:
  group: p3-ai-research-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  training-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        strategy: [INTRADAY, ONE_TO_THREE_DAYS, ONE_WEEK, FIFTEEN_TO_THIRTY_DAYS]
    env:
      TRAINING_ITERATIONS: '10'
      TRAINING_BATCH_STRATEGY: ${{ matrix.strategy }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test loss-aware feedback selection
        run: python -m unittest tests.test_walk_forward_feedback
      - name: Run 24-month walk-forward research pilot
        shell: bash
        run: |
          set -o pipefail
          python -m p3.walk_forward_training_entry | tee batch-results.jsonl
      - name: Summarize research trades
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('batch-results.jsonl')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## 24-month walk-forward research (not holdout)\n\n')
              if not path.exists():
                  out.write('No research results. Inspect logs.\n')
              else:
                  results = []
                  for line in path.read_text().splitlines():
                      try:
                          row = json.loads(line)
                          if row.get('status') == 'RESEARCH_COMPLETE':
                              results.append(row)
                      except ValueError:
                          pass
                  for result in results:
                      out.write('Strategy: ' + result['strategy'] + '\n\n')
                      out.write('| Trial | Closed trades | Annualized % | Win rate % | Max drawdown % | Feedback source |\n')
                      out.write('|---:|---:|---:|---:|---:|---|\n')
                      for trial in result['iterations']:
                          m = trial['metrics']
                          out.write(f"| {trial['trial_index']} | {trial['trade_count']} | {m.get('annualized_return_percent')} | {m.get('win_rate_percent')} | {m.get('max_close_to_close_drawdown_percent')} | {trial['selection_basis']} |\n")
                      out.write(f"\nFeedback used: {result.get('feedback_used_for_candidate_selection')}; best observed trial: {result.get('best_observed_trial_index')}.\n")
                      out.write('\nHoldout untouched; research candidates are not qualified for promotion.\n')
                  if not results:
                      out.write('No completed research report.\n')
          PY
      - name: Preserve research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-${{ matrix.strategy }}-${{ github.run_id }}
          path: batch-results.jsonl
          retention-days: 90
          if-no-files-found: ignore
