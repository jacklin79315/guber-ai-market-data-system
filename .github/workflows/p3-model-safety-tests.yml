name: P3 Model Safety Tests
on:
  push:
    branches: [main, feature/p3b-paper-engine]
    paths:
      - 'p3/**'
      - 'tests/test_model_*.py'
      - 'tests/test_feedback_candidate_research.py'
      - 'tests/test_training_registry.py'
      - 'tests/test_champion_challenger.py'
      - '.github/workflows/p3-model-safety-tests.yml'
  pull_request:
    paths:
      - 'p3/**'
      - 'tests/test_model_*.py'
      - 'tests/test_training_registry.py'
      - 'tests/test_champion_challenger.py'
      - '.github/workflows/p3-model-safety-tests.yml'
  workflow_dispatch:
jobs:
  safety-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research test dependencies
        run: pip install -r requirements.txt
      - name: Run model safety regression tests
        run: |
          python -m unittest discover -s tests -p 'test_model_*.py' -v
          python -m unittest tests.test_feedback_candidate_research -v
          python -m unittest discover -s tests -p 'test_champion_challenger.py' -v
          python -m unittest discover -s tests -p 'test_training_registry.py' -v
