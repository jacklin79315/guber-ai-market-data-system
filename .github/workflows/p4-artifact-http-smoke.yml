name: P4 artifact HTTP smoke (isolated)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p4-artifact-http-smoke.yml'
permissions:
  contents: read
concurrency:
  group: p4-artifact-http-smoke
  cancel-in-progress: false
jobs:
  artifact-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: p4-research
    defaults:
      run:
        working-directory: frontend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify configured secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: HTTP chunk write, idempotent replay and readback
        run: node p4-artifact-http-smoke.mjs
