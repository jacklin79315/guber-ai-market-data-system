name: P4 one-shot multiscale historical research
on:
  push:
    paths:
      - 'research-triggers/p4-entry-multiscale-20261019.txt'
permissions:
  contents: read
concurrency:
  group: p4-diagnostic-research
  cancel-in-progress: false
jobs:
  research-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: p4-research
    defaults:
      run:
        working-directory: frontend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      P4_RESEARCH_CONFIRM: RESEARCH_ONLY
      P4_SOURCE_JOB_ID: p4_diag_entry_priorwindow_35pct_20261019_01
      P4_FOLLOWUP_TASK_ID: p4_followup_entry_multiscale_20261019_01
      P4_FOLLOWUP_EXECUTION_ID: p4_diag_entry_multiscale_20261019_01
      P4_FROM_MS: '1763503200000'
      P4_TO_MS: '1770699600000'
      P4_AS_OF_MS: '1770706800000'
      P4_SOURCE_WINDOW_END_MS: '1777903200000'
      P4_EXPLORATION_STEPS: '1,2,3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute bounded multiscale research-only follow-up
        run: node p4-diagnostic-follow-up-one-shot.mjs
