name: P3 AI 100 Experiment Batch

on:
  workflow_dispatch:
    inputs:
      generation:
        description: 'Generation number (1 for baseline)'
        required: true
        default: '1'
      parent_run_id:
        description: 'Previous generation GitHub run ID; required for generation 2+'
        required: false
      previous_validation_window:
        description: 'Previous validation [start_ms,end_ms] JSON'
        required: false
      current_validation_window:
        description: 'New validation [start_ms,end_ms] JSON'
        required: false

permissions:
  contents: read

jobs:
  training-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        strategy: [INTRADAY, ONE_TO_THREE_DAYS, ONE_WEEK, FIFTEEN_TO_THIRTY_DAYS]
    env:
      TRAINING_GENERATION: ${{ inputs.generation }}
      TRAINING_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      TRAINING_PARENT_VALIDATION_WINDOW: ${{ inputs.previous_validation_window }}
      TRAINING_CURRENT_VALIDATION_WINDOW: ${{ inputs.current_validation_window }}
      TRAINING_BATCH_STRATEGY: ${{ matrix.strategy }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate experiment grid
        run: python -m unittest tests.test_ai_training_batch tests.test_iterative_generation
      - name: Run 25 validation-only training trials
        shell: bash
        run: |
          set -o pipefail
          python -m p3.ai_training_batch | tee batch-results.jsonl
      - name: Preserve every experiment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-batch-${{ matrix.strategy }}-${{ github.run_id }}
          path: batch-results.jsonl
          retention-days: 90
          if-no-files-found: ignore
