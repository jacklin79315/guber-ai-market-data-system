name: P3B Paper Replay Tests
on:
  push:
    branches:
      - feature/p3b-paper-engine
  pull_request:
    paths:
      - "p3/**"
      - "tests/test_p3_*.py"
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run P3B tests
        run: python -m unittest discover -s tests -p 'test_p3_*.py' -v
