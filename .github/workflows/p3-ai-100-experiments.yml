name: P3 AI 100 Experiment Batch

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Sequential feedback iterations per strategy (5 or 100)'
        required: true
        type: choice
        options:
          - '5'
          - '100'
        default: '100'
      generation:
        description: 'Generation number (1 for baseline)'
        required: true
        default: '1'
      parent_run_id:
        description: 'Previous generation GitHub run ID; required for generation 2+'
        required: false
      previous_validation_window:
        description: 'Previous validation [start_ms,end_ms] JSON'
        required: false
      current_validation_window:
        description: 'New validation [start_ms,end_ms] JSON'
        required: false

concurrency:
  group: p3-ai-research-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  training-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        strategy: [INTRADAY, ONE_TO_THREE_DAYS, ONE_WEEK, FIFTEEN_TO_THIRTY_DAYS]
    env:
      TRAINING_GENERATION: ${{ inputs.generation || '1' }}
      TRAINING_ITERATIONS: ${{ inputs.iterations || '100' }}
      TRAINING_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      TRAINING_PARENT_VALIDATION_WINDOW: ${{ inputs.previous_validation_window }}
      TRAINING_CURRENT_VALIDATION_WINDOW: ${{ inputs.current_validation_window }}
      TRAINING_BATCH_STRATEGY: ${{ matrix.strategy }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate experiment grid
        run: python -m unittest tests.test_independent_model_params tests.test_adaptive_layer_selection tests.test_indicator_interaction_learning tests.test_adaptive_trial_selection tests.test_ai_training_batch tests.test_iterative_generation tests.test_generation_comparison tests.test_same_window_promotion tests.test_generation_evaluator tests.test_generation_readiness tests.test_training_data_quality tests.test_autonomous_generation_planner tests.test_research_lease_policy tests.test_research_job_guard
      - name: Run sequential feedback-driven learning iterations
        shell: bash
        run: |
          set -o pipefail
          python -m p3.autonomous_training_loop | tee batch-results.jsonl
      - name: Publish learning scores in GitHub Actions summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          file = pathlib.Path('batch-results.jsonl')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Autonomous learning results\n\n')
              if not file.exists():
                  out.write('No result file was produced.\n')
              else:
                  results = []
                  for line in file.read_text().splitlines():
                      try:
                          item = json.loads(line)
                          if item.get('status') == 'ITERATION_RESULT':
                              results.append(item)
                      except (ValueError, TypeError):
                          pass
                  out.write('| Iteration | Status | Trading validation score | Return % | Annualized MTM % | Win rate % | Mean trade score | Drawdown % | Trades | Eligible | Parameters |\n')
                  out.write('|---:|---|---:|---:|---:|---:|---:|---:|---:|---|---|\n')
                  for item in results:
                      out.write(f"| {item['trial_index']} | {item['status']} | {item.get('validation_score')} | {item.get('validation_return_percent')} | {item.get('validation_annualized_mark_to_market_return_percent')} | {item.get('validation_win_rate_percent')} | {item.get('validation_mean_score_q')} | {item.get('validation_drawdown_percent')} | {item.get('validation_trades')} | {item.get('validation_eligible')} | `{json.dumps(item['params'])}` |\n")
                  if not results:
                      out.write('No completed iteration results were found; inspect the job log.\n')
                  else:
                      completed = [x for x in results if x['status'] == 'COMPLETE']
                      eligible = [x for x in completed if x.get('validation_eligible') is True and x.get('validation_score') is not None]
                      out.write(f"\nCompleted {len(completed)} of {len(results)} iterations.\n")
                      if eligible:
                          first = eligible[0]
                          best = max(eligible, key=lambda x: x['validation_score'])
                          gain = best['validation_score'] - first['validation_score']
                          out.write(f"\nFirst successful score: {first['validation_score']:.6f}; best score: {best['validation_score']:.6f}; gain: {gain:+.6f}.\n")
                          out.write("\nThese are validation-only trading replay results, not holdout or live-trading proof.\n")
                      else:
                          out.write("\nNo validation-eligible trading models; review the recorded replay metrics.\n")
          PY
      - name: Preserve every experiment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-batch-${{ matrix.strategy }}-${{ github.run_id }}
          path: batch-results.jsonl
          retention-days: 90
          if-no-files-found: ignore
