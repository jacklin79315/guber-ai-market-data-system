name: P3 Continuous Paper Learning
on:
  push:
    branches: [feature/p3b-paper-engine]
    paths:
      - 'p3/analog_research_report.py'
      - 'p3/analog_walk_forward.py'
      - 'p3/paper_learning.py'
      - 'tests/test_paper_direction.py'
      - 'tests/test_paper_learning.py'
      - 'tests/test_paper_outcome_memory.py'
      - 'p3/paper_outcome_memory.py'
      - 'p3/four_strategy_analog.py'
      - 'p3/analog_data_loader.py'
      - '.github/workflows/p3-analog-research-report.yml'
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: "Research market"
        required: true
        type: choice
        default: BTCUSDT
        options: [BTCUSDT, ETHUSDT]
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        strategy: [INTRADAY, ONE_TO_THREE_DAYS, ONE_WEEK, FIFTEEN_TO_THIRTY_DAYS]
        mode: [STRICT, EXPLORATION]
    permissions:
      contents: read
    env:
      ANALOG_SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
      ANALOG_STRATEGY: ${{ matrix.strategy }}
      ANALOG_EXPLORATION: ${{ matrix.mode == 'EXPLORATION' }}
      ANALOG_EVALUATION_BARS: "40"
      PAPER_OUTCOME_PERSIST: "true"
      PAPER_MEMORY_READ: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check configured credentials
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Missing repository Supabase secrets"
            exit 1
          }
      - name: Unit test paper learner
        run: python -m unittest tests.test_paper_learning tests.test_paper_direction tests.test_paper_outcome_memory
      - name: Read-only chronological analog research
        shell: bash
        run: |
          set -o pipefail
          python -m p3.analog_research_report | tee paper-research.jsonl
      - name: Archive research and learning results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-learning-${{ matrix.strategy }}-${{ matrix.mode }}
          path: paper-research.jsonl
          retention-days: 90
          if-no-files-found: ignore
