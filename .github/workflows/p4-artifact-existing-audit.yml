name: P4 existing artifact SHA256 audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p4-artifact-existing-audit.yml'
      - 'frontend/p4-artifact-existing-audit.mjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: p4-research
    defaults:
      run:
        working-directory: frontend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify configured secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Read-only audit of 254 existing artifact chunks
        run: node p4-artifact-existing-audit.mjs
