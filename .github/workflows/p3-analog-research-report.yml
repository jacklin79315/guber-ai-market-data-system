name: P3 Analog Research Report (manual)
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Research market"
        required: true
        type: choice
        default: BTCUSDT
        options: [BTCUSDT, ETHUSDT]
      timeframe:
        description: "Native candle timeframe"
        required: true
        type: choice
        default: 1d
        options: [1d, 4h, 1h, 15m]
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANALOG_SYMBOL: ${{ inputs.symbol }}
      ANALOG_TIMEFRAME: ${{ inputs.timeframe }}
      ANALOG_EVALUATION_BARS: "90"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check configured credentials
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Missing repository Supabase secrets"
            exit 1
          }
      - name: Read-only chronological analog research
        run: python -m p3.analog_research_report
