name: P4 existing historical diagnostic reassessment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p4-existing-diagnostic-reassessment.yml'
      - 'frontend/p4-persisted-diagnostic-reassessment.mjs'
      - 'frontend/p4-autonomous-diagnostic-research.mjs'
      - 'frontend/p4-rule-diagnostician.mjs'
      - 'frontend/p4-existing-diagnostic-reassessment-runner.mjs'
permissions:
  contents: read
concurrency:
  group: p4-existing-diagnostic-reassessment
  cancel-in-progress: false
jobs:
  reassess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: p4-research
    defaults:
      run:
        working-directory: frontend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Verify and reassess existing 24-month historical diagnostic artifacts
        run: node p4-existing-diagnostic-reassessment-runner.mjs > p4-reassessment-report.json
      - name: Publish compact research-only reassessment
        if: success()
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const report=JSON.parse(fs.readFileSync("p4-reassessment-report.json","utf8"));
          if(report.status!=="PASS"||report.ordersEnabled!==false||report.modelUpdateApplied!==false)throw Error("invalid P4 safety contract");
          const lines=["## P4 immutable 24-month reassessment","Research-only; no model update or real orders.","","| Side | Records | Reviewed before | Reviewed after |","|---|---:|---:|---:|"];
          for(const side of ["champion","challenger"]){
            const s=report.summary[side];
            lines.push("|"+side+"|"+s.sourceRecords+"|"+s.before.reviewed+"|"+s.after.reviewed+"|");
            lines.push("","### "+side+" diagnostic coverage","","```json",JSON.stringify({outcomes:s.outcomes,addedByActor:s.addedByActor,attributionAfter:s.attributionAfter,missingAfter:s.missingAfter},null,2),"```");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");
          '
      - name: Attach reproducible reassessment report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p4-24m-readonly-reassessment
          path: frontend/p4-reassessment-report.json
          retention-days: 14
