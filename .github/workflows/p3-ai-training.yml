name: P3 AI Training and Holdout Replay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p3-ai-training.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: p3-training
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p3b-paper-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install training dependencies
        run: pip install -r requirements.txt
      - name: Regression tests before training
        run: |
          python -m unittest discover -s tests -p 'test_p3_stop_gap.py' -v
          python -m unittest discover -s tests -p 'test_p3_validation_selection.py' -v
          python -m unittest discover -s tests -p 'test_p3_training_settings.py' -v
      - name: Check Python syntax
        run: python -m compileall -q p3
      - name: Require configured Supabase credentials
        run: |
          test -n "$SUPABASE_URL" || { echo 'Missing SUPABASE_URL secret'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY secret'; exit 1; }
      - name: Train four models and replay untouched holdout
        timeout-minutes: 169
        shell: bash
        run: |
          set -o pipefail
          python -u -m p3.ai_train_replay | tee p3-training-report.jsonl
      - name: Show non-secret model summary
        if: success()
        run: python -c 'import json; r=json.loads(open("p3-training-report.jsonl").read().splitlines()[-1]); print(json.dumps(r, indent=2))'
      - name: Upload training report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-training-${{ github.run_id }}
          path: p3-training-report.jsonl
          if-no-files-found: ignore
          retention-days: 30
