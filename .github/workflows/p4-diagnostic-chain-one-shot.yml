name: P4 first persisted autonomous research chain
on:
  push:
    paths:
      - 'research-triggers/p4-autonomous-chain-20261019.txt'
      - 'research-triggers/p4-autonomous-chain-round2-20261019.txt'
      - 'research-triggers/p4-autonomous-chain-round3-20261019.txt'
permissions:
  contents: read
concurrency:
  group: p4-diagnostic-research
  cancel-in-progress: false
jobs:
  research-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: p4-research
    defaults:
      run:
        working-directory: frontend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      P4_RESEARCH_CONFIRM: RESEARCH_ONLY
      P4_ORDERS_ENABLED: 'false'
      P4_MODEL_UPDATE_ALLOWED: 'false'
      P4_CHAMPION_PROMOTION_ALLOWED: 'false'
      P4_INITIAL_TASK_ID: p4_auto_20261019_b_next_p4_auto_20261019_b_job_1
      P4_SOURCE_SUMMARY_JOB_ID: ''
      P4_CHAIN_ID: p4_auto_20261019_c
      P4_PRIOR_RESEARCH_JOB_IDS: p4_auto_20261019_a_job_1,p4_auto_20261019_b_job_1
      P4_WINDOWS_JSON: '[{"fromOpenTime":1764547200000,"toOpenTime":1771743600000,"asOfMs":1771747200000}]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute persisted research-only diagnostic chain
        run: node p4-diagnostic-chain-runner.mjs
