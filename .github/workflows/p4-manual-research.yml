name: P4 bounded research (manual only)
on:
  workflow_dispatch:
    inputs:
      research_scope:
        description: "SMOKE (up to 500 candles) or HISTORICAL_24M (BTC 1h, full 24 months)"
        required: true
        default: "HISTORICAL_24M"
        type: choice
        options: ["SMOKE", "HISTORICAL_24M"]
      exploration_mode:
        description: "DIAGNOSTIC_GUIDED or UNGUIDED research control"
        required: true
        default: "DIAGNOSTIC_GUIDED"
        type: choice
        options: ["DIAGNOSTIC_GUIDED", "UNGUIDED"]
      job_id:
        description: "Optional unique job id; leave empty to generate automatically"
        required: false
        default: ""
        type: string
      from_ms:
        description: "UTC aligned first candle open timestamp (milliseconds)"
        required: true
        default: "1729353600000"
        type: string
      to_ms:
        description: "UTC aligned last candle open timestamp (milliseconds)"
        required: true
        default: "1792422000000"
        type: string
      as_of_ms:
        description: "Historical cutoff, strictly after final candle close (milliseconds)"
        required: true
        default: "1792425600000"
        type: string
      iterations:
        description: "Autonomous research iterations (3, 12 or 24)"
        required: true
        default: "12"
        type: choice
        options: ["3", "12", "24"]
permissions:
  contents: read
concurrency:
  group: p4-manual-research
  cancel-in-progress: false
jobs:
  bounded-research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: p4-research
    defaults:
      run:
        working-directory: frontend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      P4_RESEARCH_CONFIRM: RESEARCH_ONLY
      P4_JOB_ID: ${{ inputs.job_id || format('p4_btc24m_{0}_{1}', inputs.exploration_mode, github.run_id) }}
      P4_EXPLORATION_MODE: ${{ inputs.exploration_mode }}
      P4_SYMBOL: BTCUSDT
      P4_TIMEFRAME: 1h
      P4_FROM_MS: ${{ inputs.from_ms }}
      P4_TO_MS: ${{ inputs.to_ms }}
      P4_AS_OF_MS: ${{ inputs.as_of_ms }}
      P4_ITERATIONS: ${{ inputs.iterations }}
      P4_RESEARCH_SCOPE: ${{ inputs.research_scope }}
      P4_PARTITIONED: ${{ inputs.research_scope == 'HISTORICAL_24M' && 'TRUE' || 'FALSE' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify secret configuration
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY secret missing"; exit 1; }
      - name: Verify read-only Supabase access and research schema
        run: node p4-research-preflight.mjs
      - name: Run selected P4 research scope (no live orders)
        run: node p4-backend-runner.mjs
