name: P3 24-Month Walk-Forward Research Pilot

on:
  workflow_dispatch:
    inputs:
      research_mode:
        description: 'Research window mode (fast: 6/12/18/24; full: 24; custom: per-strategy months)'
        type: choice
        options: [fast, full, custom]
        default: fast
        required: true
      intraday_months:
        description: 'Custom INTRADAY months (1-24)'
        type: string
        default: '6'
      one_to_three_days_months:
        description: 'Custom ONE_TO_THREE_DAYS months (1-24)'
        type: string
        default: '12'
      one_week_months:
        description: 'Custom ONE_WEEK months (1-24)'
        type: string
        default: '18'
      fifteen_to_thirty_days_months:
        description: 'Custom FIFTEEN_TO_THIRTY_DAYS months (1-24)'
        type: string
        default: '24'
  # Research is manual-only; code pushes run unit tests instead.

concurrency:
  group: p3-ai-research-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  training-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        strategy: [INTRADAY, ONE_TO_THREE_DAYS, ONE_WEEK, FIFTEEN_TO_THIRTY_DAYS]
    env:
      TRAINING_ITERATIONS: '10'
      RESEARCH_MODE: ${{ inputs.research_mode || 'full' }}
      RESEARCH_CUSTOM_MONTHS: ${{ matrix.strategy == 'INTRADAY' && inputs.intraday_months || matrix.strategy == 'ONE_TO_THREE_DAYS' && inputs.one_to_three_days_months || matrix.strategy == 'ONE_WEEK' && inputs.one_week_months || inputs.fifteen_to_thirty_days_months }}
      TRAINING_BATCH_STRATEGY: ${{ matrix.strategy }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test loss-aware feedback selection
        run: python -m unittest tests.test_walk_forward_feedback
      - name: Run selected-window walk-forward research pilot
        shell: bash
        run: |
          set -o pipefail
          python -m p3.walk_forward_training_entry | tee batch-results.jsonl
      - name: Summarize research trades
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('batch-results.jsonl')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Walk-forward research (not holdout)\n\n')
              if not path.exists():
                  out.write('No research results. Inspect logs.\n')
              else:
                  results = []
                  for line in path.read_text().splitlines():
                      try:
                          row = json.loads(line)
                          if row.get('status') == 'RESEARCH_COMPLETE':
                              results.append(row)
                      except ValueError:
                          pass
                  for result in results:
                      out.write('Strategy: ' + result['strategy'] + f"; mode: {result.get('research_mode')}; months: {result.get('research_months')}" + '\n\n')
                      out.write('| Trial | Closed trades | Annualized % | Win rate % | Max drawdown % | Feedback source |\n')
                      out.write('|---:|---:|---:|---:|---:|---|\n')
                      for trial in result['iterations']:
                          m = trial['metrics']
                          out.write(f"| {trial['trial_index']} | {m.get('normal_closed_trades')} | {m.get('annualized_return_percent')} | {m.get('win_rate_percent')} | {m.get('max_close_to_close_drawdown_percent')} | {trial['selection']['status']} |\n")
                      out.write(f"\nCandidates run: {result.get('new_candidates_run')}; stop reason: {result.get('stop_reason')}.\n")
                      for trial in result['iterations']:
                          audit = trial.get('severe_drawdown_audit')
                          if audit:
                              out.write(f"\n### Severe drawdown audit: trial {trial['trial_index']}\n\n")
                              out.write(f"Status: {audit['status']}; drawdown: {audit['max_drawdown_percent']:.2f}%; "
                                        f"closed exits: {audit['closed_trade_events']}.\n\n")
                              out.write('| Direction | Closed | Losses | Stop exits | Net PnL |\n')
                              out.write('|---|---:|---:|---:|---:|\n')
                              for side, group in sorted(audit['by_direction'].items()):
                                  out.write(f"| {side} | {group['closed']} | {group['losses']} | "
                                            f"{group['stop_losses']} | {group['net_pnl']:.2f} |\n")
                              out.write('\n| Exit reason | Closed | Net PnL |\n')
                              out.write('|---|---:|---:|\n')
                              for reason, group in sorted(audit['by_exit_reason'].items()):
                                  out.write(f"| {reason} | {group['closed']} | {group['net_pnl']:.2f} |\n")
                              out.write(f"\nGross winning PnL: {audit['gross_winning_pnl']:.2f}; "
                                        f"gross losing PnL: {audit['gross_losing_pnl']:.2f}; "
                                        f"raw gap: {audit.get('net_pnl_reconciliation_gap')}; boundary settlement: {audit.get('backtest_end_fees_net_pnl')}; adjusted gap: {audit.get('realized_pnl_after_boundary_reconciliation_gap')}.\n\n")
                              out.write(f"Worst episode: {audit.get('worst_drawdown_episode')}; "
                                        f"signal counts: {audit['signal_counts']}; "
                                        f"ambiguous exits: {audit['ambiguous_exit_count']}.\n\n")
                              out.write('Audit only: not eligible for candidate selection or promotion.\n')
                      for trial in result['iterations']:
                          for key, title, groups_key in (
                              ('trade_forecast_association', 'Direction forecast and trade outcomes', 'by_side_and_direction_alignment'),
                              ('trade_structure_association', 'Predicted range and trade outcomes', 'by_side_and_entry_range')):
                              diagnostic = trial.get(key) or {}
                              if not diagnostic:
                                  continue
                              out.write(f"\\n### {title}: trial {trial['trial_index']}\\n\\n")
                              out.write(f"Matched: {diagnostic.get('matched_trades')}; missing/invalid: {diagnostic.get('missing_or_invalid_trades')}.\\n\\n")
                              out.write('| Group | Trades | Win rate % | Net PnL |\\n')
                              out.write('|---|---:|---:|---:|\\n')
                              for label, group in sorted((diagnostic.get(groups_key) or {}).items()):
                                  out.write(f"| {label} | {group['closed']} | {group['win_rate_percent']:.2f} | {group['net_pnl']:.2f} |\\n")
                              out.write('\\nDescriptive association only; not causal evidence or promotion eligibility.\\n')
                      for trial in result['iterations']:
                          audit = trial.get('matured_trade_forecast_audit') or {}
                          if not audit:
                              continue
                          out.write(f"\\n### Matured forecast versus trade outcome: trial {trial['trial_index']}\\n\\n")
                          out.write(f"Matched: {audit.get('matched_trades')}; skipped: {audit.get('skipped')}.\\n\\n")
                          out.write('| Direction / realized range | Trades | Win rate % | Net PnL | Mean planned RR |\\n')
                          out.write('|---|---:|---:|---:|---:|\\n')
                          for label, group in sorted((audit.get('by_direction_and_range_accuracy') or {}).items()):
                              out.write(f"| {label} | {group['closed']} | {group['win_rate_percent']:.2f} | {group['net_pnl']:.2f} | {group['mean_planned_rr']} |\\n")
                          out.write('\\nMatured research labels only; no holdout, causal attribution, or candidate selection.\\n')
                      out.write('\nHoldout untouched; research candidates are not qualified for promotion.\n')
                  if not results:
                      out.write('No completed research report.\n')
          PY
      - name: Preserve research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-${{ matrix.strategy }}-${{ github.run_id }}
          path: batch-results.jsonl
          retention-days: 90
          if-no-files-found: ignore
