name: P3 AI 100 Experiment Batch

on:
  push:
    branches: [feature/p3b-paper-engine]
    paths:
      - '.github/workflows/p3-ai-100-experiments.yml'
      - 'p3/autonomous_training_loop.py'
      - 'p3/adaptive_trial_selection.py'
      - 'p3/ai_decision_model.py'
      - 'p3/ai_training_pipeline.py'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      generation:
        description: 'Generation number (1 for baseline)'
        required: true
        default: '1'
      parent_run_id:
        description: 'Previous generation GitHub run ID; required for generation 2+'
        required: false
      previous_validation_window:
        description: 'Previous validation [start_ms,end_ms] JSON'
        required: false
      current_validation_window:
        description: 'New validation [start_ms,end_ms] JSON'
        required: false

concurrency:
  group: p3-ai-research-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  training-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        strategy: [INTRADAY, ONE_TO_THREE_DAYS, ONE_WEEK, FIFTEEN_TO_THIRTY_DAYS]
    env:
      TRAINING_GENERATION: ${{ inputs.generation || '1' }}
      TRAINING_ITERATIONS: '5'
      TRAINING_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      TRAINING_PARENT_VALIDATION_WINDOW: ${{ inputs.previous_validation_window }}
      TRAINING_CURRENT_VALIDATION_WINDOW: ${{ inputs.current_validation_window }}
      TRAINING_BATCH_STRATEGY: ${{ matrix.strategy }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate experiment grid
        run: python -m unittest tests.test_indicator_interaction_learning tests.test_adaptive_trial_selection tests.test_ai_training_batch tests.test_iterative_generation tests.test_generation_comparison tests.test_same_window_promotion tests.test_generation_evaluator tests.test_generation_readiness tests.test_training_data_quality tests.test_autonomous_generation_planner tests.test_research_lease_policy tests.test_research_job_guard
      - name: Run 5 sequential feedback-driven learning iterations
        shell: bash
        run: |
          set -o pipefail
          python -m p3.autonomous_training_loop | tee batch-results.jsonl
      - name: Publish learning scores in GitHub Actions summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          file = pathlib.Path('batch-results.jsonl')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Autonomous learning results\n\n')
              if not file.exists():
                  out.write('No result file was produced.\n')
              else:
                  results = []
                  for line in file.read_text().splitlines():
                      try:
                          item = json.loads(line)
                          if item.get('status') == 'ITERATION_RESULT':
                              results.append(item)
                      except (ValueError, TypeError):
                          pass
                  out.write('| Iteration | Status | Validation score | Parameters |\n')
                  out.write('|---:|---|---:|---|\n')
                  for item in results:
                      out.write(f"| {item['trial_index']} | {item['status']} | {item.get('validation_score')} | `{json.dumps(item['params'])}` |\n")
                  if not results:
                      out.write('No completed iteration results were found; inspect the job log.\n')
                  else:
                      completed = [x for x in results if x['status'] == 'COMPLETE']
                      out.write(f"\nCompleted {len(completed)} of {len(results)} iterations.\n")
          PY
      - name: Preserve every experiment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-batch-${{ matrix.strategy }}-${{ github.run_id }}
          path: batch-results.jsonl
          retention-days: 90
          if-no-files-found: ignore
